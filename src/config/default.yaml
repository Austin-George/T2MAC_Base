# --- Defaults & T2MAC P2P Parameters ---

# --- pymarl options ---
runner: "episode"
mac: "tmac_p2p_comm_mac"
env: "sc2"
env_args: {}
batch_size_run: 1
test_nepisode: 20
test_interval: 2000
test_greedy: True
log_interval: 2000
runner_log_interval: 2000
learner_log_interval: 2000
t_max: 10000
use_cuda: True
buffer_cpu_only: True

# --- Logging options ---
use_tensorboard: True
save_model: True                  # ENABLED: Save checkpoints so we can resume after Colab crashes
save_model_interval: 500000       # Save every 500K steps (~every 45 min)
checkpoint_path: ""
evaluate: False
load_step: 0
save_replay: False
local_results_path: "results"

# --- RL hyperparameters ---
gamma: 0.99
batch_size: 32
buffer_size: 5000
lr: 0.0005
critic_lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
grad_norm_clip: 10

# --- Agent parameters ---
agent: "tmac_p2p_comm_rnn_msg"
rnn_hidden_dim: 64
obs_agent_id: True
obs_last_action: True

# --- T2MAC P2P Communication Parameters ---
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
target_update_interval: 200
agent_output_type: "q"
double_q: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64
comm_coef: 0.05
min_uncer: 0.1
n_value: 64
n_key: 64
n_query: 64
lambda_entropy: 0.0
learner: "tmac_p2p_comm_learner"
name: "tmac_p2p_comm"

# --- Experiment running params ---
repeat_id: 1
label: "default_label"
